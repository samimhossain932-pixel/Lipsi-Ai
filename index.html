<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lipsi AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101322;
  color: white;
  text-align: center;
}
header {
  padding: 25px;
  background: #191e35;
}
h1 { color: #8c9eff; }
main { padding: 25px 15px; }
#chat {
  max-width: 500px;
  margin: auto;
  text-align: left;
}
#messages {
  min-height: 180px;
  max-height: 45vh;
  overflow-y: auto;
  padding: 12px;
  background: #191e35;
  border-radius: 12px;
}
input, button {
  box-sizing: border-box;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}
input {
  width: 100%;
  margin: 12px 0;
}
button {
  background: #7187ff;
  color: white;
  margin: 4px;
}
p { line-height: 1.5; }
</style>
</head>

<body>
<header>
  <h1>🤖 Lipsi</h1>
  <p>Your personal assistant</p>
</header>

<main>
  <div id="chat">
    <div id="messages">
      <p><b>Lipsi:</b> Hello! I'm Lipsi. How can I help you?</p>
    </div>

    <input id="question" placeholder="Type your message...">

    <button onclick="sendMessage()">Send</button>
    <button onclick="listen()">🎙️ Speak</button>
    <button onclick="readAnswer()">🔊 Read answer</button>
    <button onclick="saveName()">💾 Remember name</button>
    <button onclick="clearChat()">Clear chat</button>
  </div>
</main>

<script>
let lastAnswer = "Hello! I'm Lipsi, your personal assistant.";
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxDlK_0CQrekTbBxpOFv9ehsNro0btPS7l9Nnv-xS1XSKfU6yw7g-Rm6V3PeLaKYp_q/exec";

function addMessage(who, text) {
  const p = document.createElement("p");
  const b = document.createElement("b");
  b.textContent = who + ": ";
  p.appendChild(b);
  p.appendChild(document.createTextNode(text));
  document.getElementById("messages").appendChild(p);
  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("question");
  const q = input.value.trim();

  if (!q) return;

  addMessage("You", q);
  input.value = "";

  try {
    addMessage("  const messages = document.getElementById("messages");
  const thinking = document.createElement("p");
  thinking.textContent = "Lipsi: Thinking...";
  messages.appendChild(thinking);

  try {");

    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        question: q
      })
    });

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error);
    }

    const answer = data.reply || data.answer;

    if (!answer) {
      throw new Error("No answer received from Gemini.");
    }

    lastAnswer = answer;
    addMessage("Lipsi", answer);

  } catch (error) {
    console.error("Lipsi error:", error);

    const message = "Sorry, I couldn't connect to my AI. " +
      "Please check the backend URL and deployment settings.";

    lastAnswer = message;
    addMessage("Lipsi", message);

  }
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input isn't supported here. Try Chrome on Android.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    document.getElementById("question").value =
      e.results[0][0].transcript;
    sendMessage();
  };
  recognition.onerror = () => alert("Please try speaking again.");
  recognition.start();
}

function readAnswer() {
  if (!("speechSynthesis" in window)) {
    alert("Speech output isn't supported in this browser.");
    return;
  }

  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(lastAnswer));
}

function saveName() {
  const name = prompt("What should Lipsi remember your name as?");
  if (name && name.trim()) {
    localStorage.setItem("lipsiName", name.trim());
    alert("Your name has been saved on this browser.");
  }
}

function clearChat() {
  document.getElementById("messages").replaceChildren();
  lastAnswer = "Hello! I'm Lipsi, your personal assistant.";
}
</script>
</body>
</html>
